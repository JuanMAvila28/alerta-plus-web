name = "alerta-plus-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Not secret (plan section 7.3).
GOOGLE_CLIENT_ID = "347636936339-9cg9qkrkem619pi3tvau6300avmncja9.apps.googleusercontent.com"
JWT_KID = "dev-1"
APP_URL = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "alerta"
database_id = "local-dev"            # replace with the real id from `wrangler d1 create alerta`
migrations_dir = "migrations"

# Basic per-IP limit on /api/auth/* (plan section 7.9).
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Per-user limit on POST /api/checkout.
[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Secret (wrangler secret put JWT_PRIVATE_KEY; locally in worker/.dev.vars):
#   JWT_PRIVATE_KEY = ES256 private JWK as JSON
#
# Wompi. Without them /api/checkout answers 503.
#   WOMPI_PUBLIC_KEY = pub_test_… / pub_prod_… (not secret: it can go in [vars] once the account exists)
#   WOMPI_INTEGRITY_SECRET = test_integrity_… / prod_integrity_… (secret)
#   WOMPI_EVENTS_SECRET = test_events_… / prod_events_… (secret)
